# Render Blueprint for the OCR service (optional — Railway / Fly.io also work
# with the Dockerfile directly).
services:
  - type: web
    name: receipt-ocr
    runtime: docker
    dockerContext: ./ocr-service
    dockerfilePath: ./ocr-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OCR_API_KEY
        generateValue: true
      - key: DATE_ORDER
        value: AUTO
